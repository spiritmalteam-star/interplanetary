name: DB backup (manual / weekly) — encrypted pg_dump of production
on:
  workflow_dispatch:
    inputs:
      pg_major:
        description: Postgres major version of the production server (client must match)
        default: '16'
  schedule:
    - cron: '17 3 * * 0'
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse unless configured (never uploads a plaintext dump)
        env:
          DB: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "NOT CONFIGURED: add repository secrets PRODUCTION_DATABASE_URL (a READ-ONLY role is enough) and BACKUP_PASSPHRASE. Nothing was dumped."
            exit 0
          fi
          echo "CONFIGURED=1" >> "$GITHUB_ENV"
      - name: Dump and encrypt
        if: env.CONFIGURED == '1'
        env:
          DB: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
          V: ${{ inputs.pg_major || '16' }}
        run: |
          docker run --rm -e DB -v "$PWD":/out postgres:$V sh -c 'pg_dump -Fc "$DB" -f /out/reflectme.dump'
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o reflectme-$(date -u +%F).dump.gpg reflectme.dump
          rm reflectme.dump
          ls -l *.gpg
      - uses: actions/upload-artifact@v4
        if: env.CONFIGURED == '1'
        with:
          name: reflectme-db-backup
          path: '*.dump.gpg'
          retention-days: 30
