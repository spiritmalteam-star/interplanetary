name: SEO + smoke probe (production, read-only)
on:
  workflow_dispatch:
    inputs:
      base:
        default: https://www.reflectme.space
      alt:
        default: https://reflectme.space
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 qa/seo_probe.py "${{ inputs.base }}" "${{ inputs.alt }}"
