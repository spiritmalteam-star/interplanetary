name: Visual capture (public site, read-only)
on:
  workflow_dispatch:
    inputs:
      base:
        description: Base URL to capture (production or a preview)
        default: https://www.reflectme.space
      label:
        description: Artifact label, e.g. before or after
        default: before
jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python qa/capture.py --base "${{ inputs.base }}" --out captures --route /?room=codex --route /?room=books --route /?room=music --route /?room=akashic --route /?room=invent --route /?room=quantum --route /?room=healx --route /?room=atelier --route /?room=studio --route /?room=library --route /?room=mirroros --route /?room=scopes --route /?room=gathering --route /?room=about
      - name: Mirror Entity chat probe
        if: always()
        run: python qa/chat_probe.py "${{ inputs.base }}" captures "${{ inputs.label }}"
      - name: Chronoscope render probe
        if: always()
        run: python qa/probe_chronoscope.py "${{ inputs.base }}" captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reflectme-captures-${{ inputs.label }}
          path: captures/
      - name: Publish captures to the qa-captures branch (never main)
        if: always()
        run: |
          set -e
          D="runs/${{ inputs.label }}"
          git config user.name "qa-bot"; git config user.email "qa-bot@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r captures /tmp/out/captures
          git fetch origin qa-captures || true
          if git rev-parse --verify origin/qa-captures >/dev/null 2>&1; then git checkout -B qa-captures origin/qa-captures; else git checkout --orphan qa-captures; git rm -rf . >/dev/null 2>&1 || true; fi
          mkdir -p "$D" && rm -rf "$D"/* && cp -r /tmp/out/captures/* "$D"/
          git add "$D" && git commit -m "captures: ${{ inputs.label }} of ${{ inputs.base }}" || true
          git push origin qa-captures
